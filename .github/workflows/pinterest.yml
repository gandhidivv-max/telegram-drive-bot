name: Pinterest Telegram Bot Engine Workflow

on:
  schedule:
    - cron: '0 * * * *'  # ప్రతీ 1 గంటకి ఆటోమేటిక్ గా రన్ అవుతుంది
  workflow_dispatch:      # Manual గా రన్ చేయడానికి

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Script Engine
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save and Commit History State Files (Data Safety Protection)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add history/ bot_state.json daily_report.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update posted history & bot state" && git push)
          
